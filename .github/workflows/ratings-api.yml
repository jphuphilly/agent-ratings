name: ratings-api

on:
  push:
    branches: [main]
    paths:
      - "services/ratings-api/**"
      - ".github/workflows/ratings-api.yml"
    tags:
      - "ratings-api-v*"
  pull_request:
    paths:
      - "services/ratings-api/**"
      - ".github/workflows/ratings-api.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: services/ratings-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Every change: prove the image builds. Only a release tag pushes it.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ratings-api-v* ]]; then
            VERSION="${GITHUB_REF_NAME#ratings-api-v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be ratings-api-vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="sha-${GITHUB_SHA::7}"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.v.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/ratings-api
          push: ${{ steps.v.outputs.push == 'true' }}
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/${{ github.repository }}/ratings-api:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
