{{- if .Values.monitoring.enabled }}
# Grafana dashboard, picked up by the Grafana sidecar (label grafana_dashboard=1, all namespaces).
# Thresholds are hard-coded to the default targets (99.5% / 99%); update them if values.yaml changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-slo-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "ratings-api.labels" . | nindent 4 }}
data:
  ratings-api-slo.json: |
    {
      "title": "ratings-api SLOs",
      "uid": "ratings-api-slo",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "slo",
        "ratings-api"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability (1h)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1 - ratings_api:sli_errors:ratio_rate1h",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error budget remaining (3d)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "clamp_min(ratings_api:error_budget_remaining:ratio, 0)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Burn rate (1h)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ratings_api:sli_errors:ratio_rate1h / (1 - 0.995)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Requests/s",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ratings_api:requests:rate5m",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "5xx ratio by window (alert lines: 14.4x and 6x budget)",
      "description": "On a fresh cluster with under 1h of data, the 1h and 6h lines contain the same samples and overlap exactly.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ratings_api:sli_errors:ratio_rate5m",
              "legendFormat": "5m",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "ratings_api:sli_errors:ratio_rate1h",
              "legendFormat": "1h",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "C",
              "expr": "ratings_api:sli_errors:ratio_rate6h",
              "legendFormat": "6h",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "D",
              "expr": "vector(14.4 * (1 - 0.995))",
              "legendFormat": "fast-burn threshold",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "E",
              "expr": "vector(6 * (1 - 0.995))",
              "legendFormat": "slow-burn threshold",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency: share of /api requests slower than 250ms",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ratings_api:sli_slow:ratio_rate5m",
              "legendFormat": "5m",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "ratings_api:sli_slow:ratio_rate1h",
              "legendFormat": "1h",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "C",
              "expr": "vector(14.4 * (1 - 0.99))",
              "legendFormat": "fast-burn threshold",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Requests by route and status",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (route, status) (rate(http_requests_total{job=\"ratings-api\"}[5m]))",
              "legendFormat": "{{`{{route}}`}} {{`{{status}}`}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
{{- end }}
