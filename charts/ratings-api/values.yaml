replicaCount: 2

image:
  repository: ghcr.io/jphuphilly/agent-ratings/ratings-api
  # Release flow: push git tag ratings-api-vX.Y.Z -> CI publishes image X.Y.Z -> bump this -> Argo deploys.
  tag: "0.1.1"
  pullPolicy: IfNotPresent

containerPort: 8000

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

route:
  enabled: true
  hostname: ratings-dev.theblockchainarcade.io
  # Only /api is public. /healthz and /metrics stay on the pod port.
  pathPrefix: /api
  gateway:
    name: eg
    namespace: envoy-gateway-system
    sectionName: https
