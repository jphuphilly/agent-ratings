# Argo CD owns apps/: anything committed there is deployed; anything removed is pruned;
# manual drift is reverted (selfHeal). Repo is public, so no repo credentials needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jphuphilly/agent-ratings.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
